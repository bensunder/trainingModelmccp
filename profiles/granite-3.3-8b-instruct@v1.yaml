# IBM Granite 3.3 8B Instruct (dense, Llama-like), US origin, Apache-2.0.
# Validated 2026-11-02 with `mccp profile validate` on the real tokenizer
# (validations/granite-3.3-8b-instruct@v1.json): tool rendering token-identical
# to the native template on 24 fixtures, string args 24/24, dims = config.json.
id: granite-3.3-8b-instruct
version: 1
display_name: IBM Granite 3.3 8B Instruct
base:
  hf_id: ibm-granite/granite-3.3-8b-instruct
  chat_template_sha256: 0bea7711316005a1c37c9941a7ee2a26311d223c979abee416aab0a402fc5b56
  revision: 51dd4bc2ade4059a6bd87649d68aa11e4fb2529b
  license: Apache-2.0
  origin_country: US
  publisher: IBM
  architecture: granite
dims:
  parameters: 8170000000
  hidden_size: 4096
  intermediate_size: 12800
  num_layers: 40
  num_attention_heads: 32
  num_kv_heads: 8
  head_dim: 128
tools:
  strategy: role_message
  role: available_tools
  json_mode: list        # the native template writes the tools as one JSON list (found by profile validate)
  json_indent: 4
reasoning:
  template_kwarg: thinking
  open_tag: "<think>"
  close_tag: "</think>"
serving:
  tool_call_parser: granite
  reasoning_parser: granite
  lora_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  max_lora_rank: 64
  min_vram_gb_bf16: 20
training:
  target_modules: all-linear
  qlora_supported: true
  min_vram_gb_qlora: 12
notes: >-
  If validation reports a rendering mismatch (e.g. the template injects a
  default system prompt when tools are present), adjust `tools` and bump the
  version; never edit a validated profile in place.
