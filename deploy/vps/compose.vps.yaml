# Control plane for a CPU-only VPS (srv1507394) in the split topology:
#   VPS:      Postgres, MinIO (S3), OPA, MLflow, API, controller (control lane)
#   GPU host: worker (gpu + serving lanes), vLLM, guard, LiteLLM  -> deploy/gpu/compose.gpu.yaml
#
# Postgres, MinIO and MLflow are reached by the GPU host, so they bind to
# MCCP_PRIVATE_BIND: the VPS's address on a private network (WireGuard /
# Tailscale), never a public interface. Default 127.0.0.1 = single-box only.
# TLS on these links is not configured yet (open P1); the private network is
# the only transport protection until then.
#
# Host ports are set in deploy/vps/.env (MCCP_*_PORT); the installer picks free ones on first run.
name: mccp

x-cp-env: &cp-env
  MCCP_DATABASE_URL: postgresql+asyncpg://mccp_app:${MCCP_APP_DB_PASSWORD}@postgres:5432/mccp
  MCCP_OWNER_DATABASE_URL: postgresql+asyncpg://mccp_owner:${MCCP_OWNER_DB_PASSWORD}@postgres:5432/mccp
  MCCP_OBJECT_STORE_URL: s3://${MCCP_S3_BUCKET:-mccp}/objects
  MCCP_S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  MCCP_FLEET_PROFILE_PATH: /app/deploy/fleet.yaml
  MCCP_PROFILES_DIR: /app/profiles
  MCCP_OPA_URL: http://opa:8181
  MCCP_MLFLOW_TRACKING_URI: http://mlflow:5000
  MCCP_GATEWAY_KIND: none

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    ports: ["${MCCP_PRIVATE_BIND:-127.0.0.1}:${MCCP_PG_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO stopped publishing maintained community images in late 2025; pin
    # MINIO_IMAGE to a digest you have vetted, or point MCCP_S3_ENDPOINT_URL at
    # AWS S3 / another S3-compatible service and drop this service.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["s3data:/data"]
    ports:
      - "${MCCP_PRIVATE_BIND:-127.0.0.1}:${MCCP_S3_PORT:-59000}:9000"
      - "127.0.0.1:${MCCP_S3_CONSOLE_PORT:-59001}:9001"
    restart: unless-stopped

  storage-init:
    build: {context: ../.., dockerfile: deploy/docker/control-plane.Dockerfile}
    environment: *cp-env
    command: ["mccp", "storage-init", "--wait", "90"]
    depends_on: {minio: {condition: service_started}}
    restart: "no"

  migrate:
    build: {context: ../.., dockerfile: deploy/docker/control-plane.Dockerfile}
    environment: *cp-env
    command: ["mccp", "db", "migrate"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"

  opa:
    image: openpolicyagent/opa:1.21.1
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level", "error", "/policy"]
    volumes: ["../../policy:/policy:ro"]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    command: >
      sh -c "pip install --quiet psycopg2-binary &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow
             --artifacts-destination /mlartifacts"
    volumes: ["mlartifacts:/mlartifacts"]
    ports: ["${MCCP_PRIVATE_BIND:-127.0.0.1}:${MCCP_MLFLOW_PORT:-55055}:5000"]
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped

  api:
    build: {context: ../.., dockerfile: deploy/docker/control-plane.Dockerfile}
    environment:
      <<: *cp-env
      MCCP_AUTH_MODE: ${MCCP_AUTH_MODE:-dev}
      MCCP_DEV_JWT_SECRET: ${MCCP_DEV_JWT_SECRET}
      MCCP_OIDC_ISSUER: ${MCCP_OIDC_ISSUER:-}
      MCCP_OIDC_AUDIENCE: ${MCCP_OIDC_AUDIENCE:-}
      MCCP_OIDC_JWKS_URL: ${MCCP_OIDC_JWKS_URL:-}
    # No signing keys: the API never signs or verifies adapters.
    ports: ["127.0.0.1:${MCCP_API_PORT:-8195}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      opa: {condition: service_started}
    restart: unless-stopped

  controller:
    # Control-lane worker: validation, policy gates, approvals. Verify-only:
    # it holds the public key, never the private signing key.
    build: {context: ../.., dockerfile: deploy/docker/control-plane.Dockerfile}
    environment:
      <<: *cp-env
      MCCP_WORKER_ID: vps-controller
      MCCP_WORKER_LANES: '["control"]'
      MCCP_SIGNING_MODE: key
      MCCP_SIGNING_PUBLIC_KEY_PATH: /run/secrets/signing-pub.pem
      MCCP_WORK_DIR: /var/lib/mccp/work
    command: ["mccp", "worker"]
    secrets: [signing-pub.pem]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      opa: {condition: service_started}
    restart: unless-stopped

secrets:
  signing-pub.pem: {file: ./secrets/signing-pub.pem}

volumes:
  pgdata: {}
  s3data: {}
  mlartifacts: {}
