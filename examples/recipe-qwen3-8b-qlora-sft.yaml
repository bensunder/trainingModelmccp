  learning_rate: {min: 0.00001, max: 0.0005}
  lora_r: {min: 4, max: 64}
max_lora_rank: 64
gpu_hourly_usd: 0.86
serving:
  serving_dtype: bfloat16
  tool_call_parser: hermes
  reasoning_parser: qwen3
  min_vllm_version: "0.29.0"
