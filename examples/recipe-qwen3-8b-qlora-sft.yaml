# Admin-curated recipe. Register with: mccp recipe-put examples/recipe-qwen3-8b-qlora-sft.yaml
# Pin `base_model.revision` to the exact Hugging Face commit you validated, and
# set `chat_template_sha256` to the SHA-256 of that revision's chat template
# ("*" disables the check; do not ship that to production).
ref: qwen3-8b-qlora-sft@v1.0.0+L40S
trainer_image: ghcr.io/YOUR_ORG/mccp-trainer@sha256:REPLACE_WITH_DIGEST
profile: qwen3-8b@v1          # profiles/qwen3-8b@v1.yaml (validated); swap the profile to swap the base model
base_model:
  id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218   # validated on GPU 2026-11-01 (docs/gpu-pilot-2026-11-01.md)
  license: Apache-2.0
  architecture: qwen3
dims:            # Qwen3-8B config.json
  parameters: 8190000000
  hidden_size: 4096
  intermediate_size: 12288
  num_layers: 36
  num_attention_heads: 32
  num_kv_heads: 8
  head_dim: 128
finetuning_types: [qlora]
target_modules: all-linear
enable_thinking: false
chat_template_sha256: "a55ee1b1660128b7098723e0abcd92caa0788061051c62d51cbe87d9cf1974d8"   # trainer pre-flight measured, same revision
engine:
  trl: "0.24.0"
  peft: "0.17.1"
  transformers: "4.57.1"
  bitsandbytes: "0.48.1"
soup:
  version: "0.72.4"
  backend: transformers      # or unsloth (faster single-GPU)
  quantization: 4bit         # NF4 QLoRA
  optimizer: paged_adamw_8bit
  scheduler: cosine
  save_steps: 100
  logging_steps: 10
defaults:
  n_epochs: 2
  learning_rate: 0.0002
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 4096
  warmup_ratio: 0.03
allowed_overrides:
