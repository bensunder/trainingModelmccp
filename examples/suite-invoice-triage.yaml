# Eval suite. Create with: mccp suite-create finance-ops examples/suite-invoice-triage.yaml
# `golden` must point at the frozen test split of the dataset version you built.
name: invoice-triage-suite
version: 1
golden: finance-ops/invoice-exceptions@v1:test
compare_fields: [decision, reason_code]
max_items: 500
effect_probes: 5
sampling: {temperature: 0.0, max_tokens: 512, seed: 0}
output_schema:
  type: object
  additionalProperties: false
  required: [decision, reason_code, next_action, variance_pct]
  properties:
    decision: {enum: [approve, hold, reject, escalate]}
    reason_code: {enum: [WITHIN_TOLERANCE, PRICE_VARIANCE, QTY_MISMATCH, MISSING_PO, DUPLICATE_INVOICE, VENDOR_BANK_CHANGE]}
    next_action: {type: string, minLength: 3, maxLength: 300}
    variance_pct: {type: [number, "null"]}
safety:
  guard_model: Qwen/Qwen3Guard-Gen-4B
  guard_base_url: http://vllm-guard:8001   # separate vLLM serving the guard model
performance: {requests: 32, concurrency: 4}
# Optional: LLM judge from a non-Qwen family (set MCCP_JUDGE_BASE_URL on the worker).
# judge:
#   model: your-judge-model
#   rubric: "Prefer the answer whose decision and next action follow AP policy and are actionable."
#   max_items: 100
# Optional: general-capability regression via lm-eval against vLLM.
# regression:
#   command: [python, deploy/scripts/lm_eval_wrapper.py, --base-url, "{base_url}", --model, "{model}", --output, "{output}", --tasks, "ifeval,gsm8k"]
#   tasks: [ifeval, gsm8k]
